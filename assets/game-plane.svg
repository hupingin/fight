<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="Game fighter jet icon, nose pointing up">
  <defs>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c9cdd"/>
      <stop offset="1" stop-color="#25558f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fc4e8"/>
      <stop offset="0.45" stop-color="#f2f9ff"/>
      <stop offset="1" stop-color="#8fb4dc"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ce8ff"/>
      <stop offset="1" stop-color="#17467f"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd45c"/>
      <stop offset="1" stop-color="#ff5a1f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#06172f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- airframe: swept wings + tail fins -->
  <path d="M50 6 C55 6 57 16 58 28 L59 42 L94 67 L94 77 L58 68 L58 82 L70 92 L70 96 L50 91 L30 96 L30 92 L42 82 L42 68 L6 77 L6 67 L41 42 L42 28 C43 16 45 6 50 6 Z"
        fill="url(#wing)" stroke="#0d2340" stroke-width="2.2" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- wing panel lines -->
  <path d="M64 47 L84 65 M36 47 L16 65" stroke="#cbe5ff" stroke-width="2" stroke-linecap="round" opacity="0.55" fill="none"/>
  <!-- wingtip markings -->
  <path d="M87 65.5 L94 67 L94 77 L87 75 Z" fill="#ff5f66"/>
  <path d="M13 65.5 L6 67 L6 77 L13 75 Z" fill="#ff5f66"/>

  <!-- fuselage -->
  <path d="M50 7 C54 10 55 20 55 34 L55 86 L45 86 L45 34 C45 20 46 10 50 7 Z"
        fill="url(#body)" stroke="#0d2340" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- nose tip -->
  <path d="M50 7 L52 15 L48 15 Z" fill="#ff5f66"/>
  <!-- exhaust nozzle -->
  <rect x="45" y="83" width="10" height="5" rx="2" fill="#1b3c63"/>
  <!-- engine flame -->
  <path d="M44 90 L50 99 L56 90 Z" fill="url(#flame)"/>
  <path d="M47 90 L50 96.5 L53 90 Z" fill="#fff3bd"/>

  <!-- cockpit canopy -->
  <path d="M50 27 C54 27 55.5 32 55.5 39 L53.5 50 L46.5 50 L44.5 39 C44.5 32 46 27 50 27 Z"
        fill="url(#glass)" stroke="#0d2340" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M47.5 31 C46.5 36 46.5 41 47.5 46" stroke="#dcf7ff" stroke-width="1.6" stroke-linecap="round" opacity="0.75" fill="none"/>
</svg>
